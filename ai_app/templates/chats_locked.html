<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EduChats — locked</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="{% url 'chats_manifest' %}">
<meta name="theme-color" content="{{ app.status_bar_color|default:'#0f1623' }}">
<link rel="icon" href="{{ app.icon_192 }}">
<link rel="apple-touch-icon" href="{{ app.icon_180 }}">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--accent:#e8001e;--accent-rgb:232,0,30;--ink:#0f1623}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px max(24px,env(safe-area-inset-bottom));
  background:radial-gradient(900px 500px at 50% -10%,rgba(var(--accent-rgb),.28),transparent 60%),var(--ink);color:#e5e7eb;
  font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-user-select:none;user-select:none}
.lk{width:100%;max-width:340px;text-align:center}
.lk-ava{width:84px;height:84px;margin:0 auto .9rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--accent),rgba(var(--accent-rgb),.55));box-shadow:0 0 0 6px rgba(var(--accent-rgb),.15),0 18px 40px rgba(0,0,0,.35);position:relative}
.lk-ava .lk-badge{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:.8rem;border:3px solid var(--ink)}
h1{margin:0;font-size:1.2rem;color:#fff;letter-spacing:-.01em}
.lk-sub{margin:.3rem 0 1.4rem;font-size:.85rem;color:#9aa3b2}
.lk-dots{display:flex;justify-content:center;gap:.7rem;height:18px;margin-bottom:.5rem}
.lk-dots i{width:14px;height:14px;border-radius:50%;border:2px solid #5b6577;transition:background .12s,border-color .12s,transform .12s}
.lk-dots i.on{background:#fff;border-color:#fff;transform:scale(1.05)}
.lk-dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.lk-err{min-height:1.3em;margin:.35rem 0 .9rem;font-size:.8rem;color:#fca5a5;font-weight:600}
.lk-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem .9rem;justify-items:center;margin:0 auto;max-width:290px}
.lk-pad button{width:72px;height:72px;border-radius:50%;border:none;background:rgba(255,255,255,.07);color:#fff;font:inherit;font-size:1.6rem;font-weight:600;cursor:pointer;
  transition:background .12s,transform .08s;-webkit-tap-highlight-color:transparent}
.lk-pad button:hover{background:rgba(255,255,255,.12)}
.lk-pad button:active{transform:scale(.94);background:rgba(255,255,255,.18)}
.lk-pad button.ghost{background:none;font-size:1.15rem;color:#c7cdd8}
.lk-pad button.ok{background:var(--accent);font-size:1.2rem}
.lk-pad button.ok:disabled{opacity:.35;cursor:default}
.lk-pad button.bio{color:#fff;font-size:1.45rem}
.lk-pad button[hidden]{visibility:hidden;display:block}
.lk-foot{margin-top:1.4rem;display:flex;flex-direction:column;gap:.55rem;align-items:center}
.lk-link{border:none;background:none;color:#9aa3b2;font:inherit;font-size:.8rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lk-link:hover{color:#fff}
.lk-bio-btn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-weight:700;font-size:.85rem;border-radius:999px;padding:.6rem 1.1rem;cursor:pointer;display:inline-flex;gap:.5rem;align-items:center}
.lk-bio-btn[hidden]{display:none}
@media (max-height:640px){.lk-pad button{width:60px;height:60px;font-size:1.35rem}.lk-ava{width:64px;height:64px;font-size:1.5rem}.lk-sub{margin-bottom:.9rem}}
</style>
</head>
<body>
<main class="lk" aria-labelledby="lkTitle">
  <div class="lk-ava" aria-hidden="true">{{ chat_user.name|slice:":1"|upper }}<span class="lk-badge"><i class="fas fa-lock"></i></span></div>
  <h1 id="lkTitle">EduChats is locked</h1>
  <p class="lk-sub" id="lkSub">Enter your PIN to open your chats.</p>
  <div class="lk-dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" maxlength="6" aria-label="PIN"
         style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px" autofocus>
  <p class="lk-err" id="err" role="alert"></p>
  <div class="lk-pad" id="pad">
    <button type="button" data-d="1">1</button><button type="button" data-d="2">2</button><button type="button" data-d="3">3</button>
    <button type="button" data-d="4">4</button><button type="button" data-d="5">5</button><button type="button" data-d="6">6</button>
    <button type="button" data-d="7">7</button><button type="button" data-d="8">8</button><button type="button" data-d="9">9</button>
    <button type="button" class="ghost bio" id="bioKey" aria-label="Use fingerprint or face" hidden><i class="fas fa-fingerprint"></i></button>
    <button type="button" data-d="0">0</button>
    <button type="button" class="ghost" id="back" aria-label="Delete"><i class="fas fa-delete-left"></i></button>
  </div>
  <div class="lk-foot">
    <button type="button" class="lk-bio-btn" id="okBtn" disabled><i class="fas fa-unlock"></i> Unlock</button>
    <button type="button" class="lk-link" id="forgot">Forgot PIN? Log out and log in with your password</button>
  </div>
</main>
<script>
(function () {
  'use strict';
  var ACCENTS = { red: ['#e8001e', '232,0,30'], blue: ['#2563eb', '37,99,235'], green: ['#16a34a', '22,163,74'], purple: ['#7c3aed', '124,58,237'],
                  orange: ['#ea580c', '234,88,12'], pink: ['#db2777', '219,39,119'], teal: ['#0d9488', '13,148,136'], black: ['#4b5563', '75,85,99'] };
  var look = {{ appearance_json|default:"{}"|safe }};
  try { if (!look.accent) look = JSON.parse(localStorage.getItem('educhats-look') || '{}') || {}; } catch (e) {}
  var a = ACCENTS[look.accent];
  if (a) { document.documentElement.style.setProperty('--accent', a[0]); document.documentElement.style.setProperty('--accent-rgb', a[1]); }

  var LOCK = '{% url "chats_lock" %}', KEY_IDS = {{ key_ids|default:"[]"|safe }}, LOCAL_KEYS = 'educhats-lock-keys-{{ chat_user.pk }}';
  // fingerprint / face only on a device that set it up itself (its key ids are remembered here)
  var mine = [];
  try { mine = (JSON.parse(localStorage.getItem(LOCAL_KEYS) || '[]') || []).filter(function (id) { return KEY_IDS.indexOf(id) !== -1; }); } catch (e) {}
  var csrf = '{{ csrf_token }}';
  var pin = '', busy = false;
  var dots = document.getElementById('dots'), err = document.getElementById('err'), ok = document.getElementById('okBtn');
  var input = document.getElementById('pinInput');
  function token() { var m = document.cookie.match(/(?:^|; )csrftoken=([^;]+)/); return m ? decodeURIComponent(m[1]) : csrf; }
  function post(data) {
    return fetch(LOCK, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': token() }, body: JSON.stringify(data) })
      .then(function (r) { return r.json().then(function (res) { res.status = r.status; return res; }, function () { return { ok: false, status: r.status, error: 'Something went wrong. Please try again.' }; }); });
  }
  function paint() {
    var n = Math.max(4, pin.length);
    while (dots.children.length < n) dots.appendChild(document.createElement('i'));
    while (dots.children.length > n) dots.lastChild.remove();
    Array.prototype.forEach.call(dots.children, function (d, i) { d.classList.toggle('on', i < pin.length); });
    ok.disabled = pin.length < 4 || busy;
  }
  function wrong(text) {
    err.textContent = text; pin = ''; input.value = ''; paint();
    dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
    if (navigator.vibrate) navigator.vibrate(120);
  }
  function opened() { err.textContent = ''; document.body.style.opacity = '.6'; location.replace(location.pathname + location.search); }
  function submit() {
    if (pin.length < 4 || busy) return;
    busy = true; paint();
    if (bioAbort) { try { bioAbort.abort(); } catch (e) {} }
    post({ action: 'unlock', pin: pin }).then(function (res) {
      busy = false;
      if (res.ok) return opened();
      if (res.status === 401) { err.textContent = res.error; setTimeout(function () { location.reload(); }, 2200); return; }
      wrong(res.error || 'Wrong PIN.');
    }).catch(function () { busy = false; wrong('Could not reach the server. Check your connection.'); });
  }
  function press(d) {
    if (busy) return;
    if (d === 'back') pin = pin.slice(0, -1);
    else if (pin.length < 6) pin += d;
    err.textContent = '';
    paint();
  }
  document.querySelectorAll('#pad [data-d]').forEach(function (b) { b.addEventListener('click', function () { press(b.dataset.d); }); });
  document.getElementById('back').addEventListener('click', function () { press('back'); });
  ok.addEventListener('click', submit);
  document.addEventListener('keydown', function (e) {
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); press(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); press('back'); }
    else if (e.key === 'Enter') { e.preventDefault(); submit(); }
  });
  document.getElementById('forgot').addEventListener('click', function () {
    if (!confirm('Log out of EduChats on this device? You can log in again with your email and password — that unlocks it too.')) return;
    fetch('{% url "chats_logout" %}', { method: 'POST', credentials: 'same-origin', headers: { 'X-CSRFToken': token() } })
      .finally(function () { location.replace('{% url "chats_page" %}'); });
  });

  // fingerprint / face / Windows Hello
  function b2u(buf) { var s = '', a = new Uint8Array(buf); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function u2b(t) { t = t.replace(/-/g, '+').replace(/_/g, '/'); while (t.length % 4) t += '='; var s = atob(t), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a.buffer; }
  var bioKey = document.getElementById('bioKey'), bioBusy = false, bioAbort = null;
  // the fingerprint prompt never blocks the keypad: typing the PIN works the whole time
  function bio(auto) {
    if (bioBusy || busy) return;
    bioBusy = true;
    bioAbort = window.AbortController ? new AbortController() : null;
    post({ action: 'bio-begin', ids: mine }).then(function (res) {
      if (!res.ok) throw new Error(res.error);
      var o = res.options;
      o.challenge = u2b(o.challenge);
      o.allowCredentials = o.allowCredentials.map(function (c) { return { type: c.type, id: u2b(c.id), transports: c.transports }; });
      return navigator.credentials.get(bioAbort ? { publicKey: o, signal: bioAbort.signal } : { publicKey: o });
    }).then(function (cred) {
      var r = cred.response;
      return post({ action: 'bio-finish', credential: { id: cred.id, response: {
        clientDataJSON: b2u(r.clientDataJSON), authenticatorData: b2u(r.authenticatorData), signature: b2u(r.signature) } } });
    }).then(function (res) {
      bioBusy = false;
      if (res.ok) return opened();
      err.textContent = res.error || 'Could not unlock. Use your PIN.';
    }).catch(function (e) {
      bioBusy = false;
      if (!auto && !(e && (e.name === 'NotAllowedError' || e.name === 'AbortError'))) err.textContent = (e && e.message && e.message.length < 120 ? e.message : '') || 'Fingerprint / face did not work. Use your PIN.';
    });
  }
  if (mine.length && window.PublicKeyCredential) {
    bioKey.hidden = false;
    document.getElementById('lkSub').textContent = 'Use your fingerprint / face, or enter your PIN.';
    bioKey.addEventListener('click', function () { bio(false); });
    if (document.hasFocus()) setTimeout(function () { bio(true); }, 350);   // ask straight away, like a phone app
  }
  paint();
})();
</script>
</body>
</html>
