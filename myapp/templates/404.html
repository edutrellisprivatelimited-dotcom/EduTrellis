{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — EduTrellis</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--red:#e8001e;--red-dark:#c0001a;--dark:#1c2333;--text:#555f6d;--head:#111418;--line:#e7eaf0;--bg-alt:#f8f9fc}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--text);background:var(--bg-alt);line-height:1.75;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--red);text-decoration:none}
a:hover{text-decoration:underline}
header{background:#fff;border-bottom:1px solid var(--line);padding:1.1rem 1.25rem}
.hd-wrap{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.logo-txt{font-family:'Sora',sans-serif;font-size:1.15rem;font-weight:900;letter-spacing:-.03em;color:var(--head)}
.logo-txt span{color:var(--red)}
main{flex:1;max-width:760px;margin:0 auto;padding:4rem 1.25rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.code{font-family:'Sora',sans-serif;font-size:clamp(4rem,12vw,7rem);font-weight:900;color:var(--red);letter-spacing:-.03em;line-height:1}
h1{font-family:'Sora',sans-serif;font-size:clamp(1.3rem,3.5vw,1.7rem);font-weight:800;color:var(--head);letter-spacing:-.02em;margin:.5rem 0 .75rem}
p{font-size:.96rem;color:var(--text);max-width:32rem;margin-bottom:2rem}
.btn-row{display:flex;gap:.9rem;flex-wrap:wrap;justify-content:center}
.btn-home{display:inline-flex;align-items:center;gap:.5rem;background:var(--red);color:#fff;font-weight:700;font-size:.9rem;padding:.75rem 1.5rem;border-radius:.5rem;transition:background .15s}
.btn-home:hover{background:var(--red-dark);text-decoration:none}
.btn-ghost{display:inline-flex;align-items:center;gap:.5rem;background:#fff;color:var(--head);font-weight:700;font-size:.9rem;padding:.75rem 1.5rem;border-radius:.5rem;border:1.5px solid var(--line);transition:border-color .15s,color .15s}
.btn-ghost:hover{border-color:var(--red);color:var(--red);text-decoration:none}
footer{text-align:center;padding:2rem 1.25rem;font-size:.8rem;color:#9aa3b0}
</style>
</head>
<body>
<header>
  <div class="hd-wrap">
    <a href="/" class="logo-txt">Edu<span>Trellis</span></a>
  </div>
</header>
<main>
  <div class="code">404</div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist or may have been moved. Let's get you back on track.</p>
  <div class="btn-row">
    <a href="/" class="btn-home"><i class="fas fa-home"></i>EduTrellis Homepage</a>
    <a href="/store/" class="btn-ghost"><i class="fas fa-store"></i>EduTrellis Store</a>
    <a href="/websitecreation/" class="btn-ghost"><i class="fas fa-code"></i>Website Creation</a>
    <a href="/AI/" class="btn-ghost"><i class="fas fa-robot"></i>EduTrellis AI</a>
  </div>
</main>
<footer>&copy; 2026 EduTrellis Private Limited. All rights reserved.</footer>
</body>
</html>
